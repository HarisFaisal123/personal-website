<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     role="img" aria-label="Instructli architecture: course material is chunked and embedded into a vector store; a student question is embedded, matched against that store, and answered from the retrieved context by a routed language model.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#55708a"/>
    </marker>
  </defs>
  <style>
    .plate { fill: #0e1620; }
    .box   { fill: #17222f; stroke: #34485e; stroke-width: 1; }
    .accbox{ fill: #14282c; stroke: #3f7d80; stroke-width: 1; }
    .t     { fill: #d3dfea; font: 600 13px ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
    .s     { fill: #8ea4b8; font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .lane  { fill: #5ec8c8; font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.6px; }
    .flow  { stroke: #55708a; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .flowd { stroke: #3f7d80; stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow); }
    .rule  { stroke: #24323f; stroke-width: 1; }
  </style>

  <rect class="plate" width="880" height="470" rx="4"/>

  <!-- ============ Lane 1: indexing ============ -->
  <text class="lane" x="30" y="34">INDEXING · OFFLINE</text>
  <line class="rule" x1="30" y1="44" x2="850" y2="44"/>

  <g>
    <rect class="box" x="30"  y="60" width="175" height="58" rx="3"/>
    <text class="t" x="46" y="84">Course material</text>
    <text class="s" x="46" y="101">CSC258 notes, slides</text>

    <rect class="box" x="245" y="60" width="175" height="58" rx="3"/>
    <text class="t" x="261" y="84">Chunker</text>
    <text class="s" x="261" y="101">split into passages</text>

    <rect class="box" x="460" y="60" width="175" height="58" rx="3"/>
    <text class="t" x="476" y="84">Embedding model</text>
    <text class="s" x="476" y="101">passage → vector</text>

    <rect class="accbox" x="675" y="60" width="175" height="58" rx="3"/>
    <text class="t" x="691" y="84">Vector store</text>
    <text class="s" x="691" y="101">indexed embeddings</text>
  </g>

  <path class="flow" d="M205 89 H239"/>
  <path class="flow" d="M420 89 H454"/>
  <path class="flow" d="M635 89 H669"/>

  <!-- ============ Lane 2: retrieval ============ -->
  <text class="lane" x="30" y="148">RETRIEVAL · PER QUESTION</text>
  <line class="rule" x1="30" y1="158" x2="747" y2="158"/>
  <line class="rule" x1="777" y1="158" x2="850" y2="158"/>

  <g>
    <rect class="box" x="30"  y="174" width="175" height="58" rx="3"/>
    <text class="t" x="46" y="198">React + TypeScript</text>
    <text class="s" x="46" y="215">student asks a question</text>

    <rect class="box" x="245" y="174" width="175" height="58" rx="3"/>
    <text class="t" x="261" y="198">FastAPI</text>
    <text class="s" x="261" y="215">Python backend</text>

    <rect class="box" x="460" y="174" width="175" height="58" rx="3"/>
    <text class="t" x="476" y="198">Embed question</text>
    <text class="s" x="476" y="215">same vector space</text>

    <rect class="accbox" x="675" y="174" width="175" height="58" rx="3"/>
    <text class="t" x="691" y="198">Semantic search</text>
    <text class="s" x="691" y="215">top-k passages</text>
  </g>

  <path class="flow" d="M205 203 H239"/>
  <path class="flow" d="M420 203 H454"/>
  <path class="flow" d="M635 203 H669"/>
  <path class="flowd" d="M762 118 V168"/>

  <!-- ============ Lane 3: generation ============ -->
  <text class="lane" x="30" y="262">GENERATION</text>
  <line class="rule" x1="30" y1="272" x2="135" y2="272"/>
  <line class="rule" x1="165" y1="272" x2="850" y2="272"/>

  <path class="flow" d="M762 232 V252 H150 V282"/>

  <g>
    <rect class="box" x="30"  y="288" width="240" height="64" rx="3"/>
    <text class="t" x="46" y="313">Prompt + context</text>
    <text class="s" x="46" y="330">retrieved passages only</text>

    <rect class="box" x="320" y="288" width="240" height="64" rx="3"/>
    <text class="t" x="336" y="313">Model router</text>
    <text class="s" x="336" y="330">OpenAI · Gemini · Mistral · Cohere</text>

    <rect class="accbox" x="610" y="288" width="240" height="64" rx="3"/>
    <text class="t" x="626" y="313">Grounded answer</text>
    <text class="s" x="626" y="330">cites course material</text>
  </g>

  <path class="flow" d="M270 320 H314"/>
  <path class="flow" d="M560 320 H604"/>

  <!-- ============ Lane 4: visualizer ============ -->
  <text class="lane" x="30" y="382">ALSO IN THE APP</text>
  <line class="rule" x1="30" y1="392" x2="850" y2="392"/>

  <rect class="box" x="30" y="404" width="820" height="52" rx="3"/>
  <text class="t" x="46" y="426">Interactive CPU datapath views</text>
  <text class="s" x="46" y="443">single-cycle · multicycle · pipelined  —  stages: IF → ID → EX → MEM → WB</text>
</svg>
